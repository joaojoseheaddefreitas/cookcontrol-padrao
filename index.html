<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CookControl - Automação Comercial</title>
    <!-- Tailwind CSS para o layout visual -->
    <script src="https://tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-900 font-['DM_Sans']">

    <!-- Painel Principal Zerado -->
    <div class="min-h-screen flex flex-col justify-center items-center p-6">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 text-center border border-gray-100">
            <h1 class="text-3xl font-bold font-['Playfair_Display'] text-orange-600 mb-2">CookControl</h1>
            <p class="text-gray-500 mb-6 text-sm">Ambiente de Configuração Padrão</p>
            
            <div class="bg-orange-50 border border-orange-100 rounded-xl p-4 mb-6">
                <p class="text-orange-800 text-sm font-medium">✨ Sistema Pronto para Novo Cliente</p>
                <p class="text-orange-600 text-xs mt-1">Insira os dados particulares no painel de administração para ativar o cardápio e as mesas.</p>
            </div>

            <div class="space-y-3">
                <div class="p-3 bg-gray-50 rounded-xl border border-gray-100 text-left">
                    <span class="text-xs font-bold text-gray-400 block uppercase tracking-wider">Status do Banco de Dados</span>
                    <span class="text-sm font-medium text-emerald-600 flex items-center mt-0.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 mr-2 animate-pulse"></span>
                        Supabase Conectado (Limpo)
                    </span>
                </div>
            </div>
            
            <p class="text-xs text-gray-400 mt-8">CookControl &copy; 2026 - Todos os direitos reservados.</p>
        </div>
    </div>

</body>
</html>
